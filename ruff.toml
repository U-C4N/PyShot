# Pinned explicitly rather than left on ruff's default: the default rule set
# widens between releases, so an unpinned CI runner would start failing on code
# that lints clean locally.
[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# DPI awareness must be set before tkinter/Pillow are imported, and every
# dependency import sits inside a guard that reports a missing package through
# MessageBoxW — so module-level imports genuinely cannot be at the top of this
# file. That is E402's whole subject, hence the exemption, scoped to the one
# file that argues for it (tests/test_pure.py keeps its own inline noqa).
"pyshot.py" = ["E402"]
