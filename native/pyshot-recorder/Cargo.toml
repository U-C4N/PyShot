[package]
name = "pyshot-recorder"
version = "3.0.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-capture = "=2.0.1"
windows = { version = "0.62.2", features = [
  "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation",
  "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_Devices_FunctionDiscovery", "Win32_System_StationsAndDesktops"
] }

[profile.release]
lto = "thin"
strip = "symbols"
